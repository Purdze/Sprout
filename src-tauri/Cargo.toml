[package]
name = "sprout"
version = "1.0.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
sysinfo = "0.31"
open = "5"
flate2 = "1"
fastnbt = "2"
toml = "0.8"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"

[[bin]]
name = "sprout"
path = "src/main.rs"
